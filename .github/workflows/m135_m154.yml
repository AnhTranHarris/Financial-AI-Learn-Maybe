name: m135-m161-research-organism

on:
  push:
  pull_request:

jobs:
  research-organism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      PYTHONWARNINGS: "error::DeprecationWarning"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile M135-M161 surfaces
        run: >-
          python -m py_compile
          src/dusty/integrated_research_cycle.py
          src/dusty/research_organism.py
          src/dusty/strategy_lab.py
          src/dusty/ollama_quant_reviewer.py
          src/dusty/hardware_certification.py
          src/dusty/experiment_queue.py
          src/dusty/experiment_manifest.py
          src/dusty/feature_registry.py
          src/dusty/strategy_genome_v2.py
          src/dusty/controlled_evolution.py
          src/dusty/strategy_family.py
          src/dusty/research_loop_governor.py
          src/dusty/native_mt5_executor.py
          tests/test_m135_integrated_research_cycle.py
          tests/test_m136_m154_research_organism.py
          tests/test_m1541_hardware_certification.py
          tests/test_m1542_qwen_timeout_hardening.py
          tests/test_m1543_qwen_hardware_budget.py
          tests/test_m155_durable_experiment_queue.py
          tests/test_m155_experiment_manifest.py
          tests/test_m156_feature_intelligence_registry.py
          tests/test_m157_strategy_genome_compiler_v2.py
          tests/test_m158_controlled_evolution.py
          tests/test_m159_strategy_family.py
          tests/test_m160_research_loop_governor.py
          tests/test_m161_native_mt5_executor.py
          tests/test_m67_tester_contract.py
          tools/smoke_m135_m154.py
          tools/smoke_m135_m154_hardware.py
          tools/smoke_m155_experiment_queue.py

      - name: M135 integrated research cycle gate
        run: python -m unittest discover -s tests -p "test_m135_integrated_research_cycle.py" -v

      - name: M136-M154 research organism gate
        run: python -m unittest discover -s tests -p "test_m136_m154_research_organism.py" -v

      - name: M154.1 hardware orchestration gate
        run: python -m unittest discover -s tests -p "test_m1541_hardware_certification.py" -v

      - name: M154.2 Qwen latency hardening gate
        run: python -m unittest discover -s tests -p "test_m1542_qwen_timeout_hardening.py" -v

      - name: M154.3 Qwen hardware budget gate
        run: python -m unittest discover -s tests -p "test_m1543_qwen_hardware_budget.py" -v

      - name: M155 experiment constitution gate
        run: python -m unittest discover -s tests -p "test_m155_experiment_manifest.py" -v

      - name: M155 durable experiment queue gate
        run: python -m unittest discover -s tests -p "test_m155_durable_experiment_queue.py" -v

      - name: M155 durable experiment queue smoke
        run: python tools/smoke_m155_experiment_queue.py --work-root "${RUNNER_TEMP}/m155-queue-smoke"

      - name: M156 feature intelligence registry gate
        run: python -m unittest discover -s tests -p "test_m156_feature_intelligence_registry.py" -v

      - name: M157 typed strategy genome compiler gate
        run: python -m unittest discover -s tests -p "test_m157_strategy_genome_compiler_v2.py" -v

      - name: M158 failure-directed controlled evolution gate
        run: python -m unittest discover -s tests -p "test_m158_controlled_evolution.py" -v

      - name: M159 family novelty lineage exhaustion gate
        run: python -m unittest discover -s tests -p "test_m159_strategy_family.py" -v

      - name: M160 research value scheduler and loop governor gate
        run: python -m unittest discover -s tests -p "test_m160_research_loop_governor.py" -v

      - name: M161 native MT5 experiment executor gate
        run: >-
          python -m unittest
          tests.test_m161_native_mt5_executor
          tests.test_m67_tester_contract
          -v

      - name: M135-M154 durable runtime smoke
        shell: bash
        if: runner.os != 'Windows'
        run: python tools/smoke_m135_m154.py --work-root "${RUNNER_TEMP}/m135-m154-smoke"

      - name: M135-M154 Windows PowerShell 5.1 validator
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $validationRoot = Join-Path $env:RUNNER_TEMP "m135-m154-validation"
          & .\tools\validate_m135_m154.ps1 -ExpectedHead $env:GITHUB_SHA -ValidationRoot $validationRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M154.1 PowerShell contract parse gate
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $scriptPath = Resolve-Path ".\tools\validate_m135_m154_hardware.ps1"
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$null,
              [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
          $scriptText = Get-Content -LiteralPath $scriptPath -Raw
          if (-not $scriptText.Contains('& powershell.exe @softwareArgs')) {
            throw "M154.1 wrapper must isolate the nested software validator in a child PowerShell process."
          }
