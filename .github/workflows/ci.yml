name: ci

on:
  push:
  pull_request:

jobs:
  reasoning-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Feature engine gate
        run: python -m unittest discover -s tests -p "test_features.py" -v
      - name: Strategy IR gate
        run: python -m unittest discover -s tests -p "test_integrity_strategy_ir.py" -v
      - name: Investment laboratory gate
        run: python -m unittest discover -s tests -p "test_investment_lab.py" -v
      - name: Investment review proofs
        run: python -m unittest discover -s tests -p "test_investment_review_proofs.py" -v
      - name: Full unittest suite
        run: python -m unittest discover -s tests -v
