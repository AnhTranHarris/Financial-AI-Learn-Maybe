name: ci

on:
  push:
  pull_request:

jobs:
  reasoning-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      PYTHONWARNINGS: "error::DeprecationWarning"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Feature engine gate
        run: python -m unittest discover -s tests -p "test_features.py" -v
      - name: Cognition derivation gate
        run: python -m unittest discover -s tests -p "test_cognition.py" -v
      - name: Execution clock gate
        run: python -m unittest discover -s tests -p "test_execution_clock.py" -v
      - name: Strategy IR gate
        run: python -m unittest discover -s tests -p "test_integrity_strategy_ir.py" -v
      - name: Investment laboratory gate
        run: python -m unittest discover -s tests -p "test_investment_lab.py" -v
      - name: Investment review proofs
        run: python -m unittest discover -s tests -p "test_investment_review_proofs.py" -v
      - name: Data acquisition gate
        run: python -m unittest discover -s tests -p "test_data_acquisition.py" -v
      - name: Event acquisition gate
        run: python -m unittest discover -s tests -p "test_event_acquisition.py" -v
      - name: MT5 symbol economics gate
        run: python -m unittest discover -s tests -p "test_mt5_symbol_snapshot.py" -v
      - name: MT5 execution parity gate
        run: python -m unittest discover -s tests -p "test_tester_parity.py" -v
      - name: M75 trust review gate
        run: python -m unittest discover -s tests -p "test_trust_review.py" -v
      - name: MT5 research gate
        run: python -m unittest discover -s tests -p "test_m66_m67.py" -v
      - name: MT5 tester contract gate
        run: python -m unittest discover -s tests -p "test_m67_tester_contract.py" -v
      - name: Demo session execution gate
        run: python -m unittest discover -s tests -p "test_m70_m73.py" -v
      - name: Demo supervisor certification gate
        run: python -m unittest discover -s tests -p "test_m74_m75.py" -v
      - name: MT5 indicator and chart intelligence gate
        run: python -m unittest discover -s tests -p "test_m76_m79.py" -v
      - name: Strategy v3 and analytical tournament gate
        run: python -m unittest discover -s tests -p "test_m80_m83.py" -v
      - name: Analysis runtime and firm mandate gate
        run: python -m unittest discover -s tests -p "test_m84_m85.py" -v
      - name: Forecast constitution dataset and market clock gate
        run: python -m unittest discover -s tests -p "test_m86_m88.py" -v
      - name: Forecast evaluation cognition and tournament gate
        run: python -m unittest discover -s tests -p "test_m89_m92.py" -v
      - name: Forecast demo and capital opportunity gate
        run: python -m unittest discover -s tests -p "test_m93_m94.py" -v
      - name: Forecast certification gate
        run: python -m unittest discover -s tests -p "test_m95.py" -v
      - name: Local runtime and basic UI gate
        run: python -m unittest discover -s tests -p "test_local_runtime_ui.py" -v
      - name: Isolated forecast provider adapter gate
        run: python -m unittest discover -s tests -p "test_provider_forecast_adapter.py" -v
      - name: Connected research gate
        run: python -m unittest discover -s tests -p "test_connected_research.py" -v
      - name: Sizing transparency and cross-version numerics gate
        run: python -m unittest discover -s tests -p "test_research_transparency.py" -v
      - name: Fixed-window evaluation and cost evidence gate
        run: python -m unittest discover -s tests -p "test_fixed_evaluation.py" -v
      - name: Prospective registration and closed-position cost gate
        run: python -m unittest discover -s tests -p "test_prospective_evidence.py" -v
      - name: Research comparison and entry-abstention gate
        run: python -m unittest discover -s tests -p "test_research_comparison.py" -v
      - name: Trade diagnosis and cost attribution gate
        run: python -m unittest discover -s tests -p "test_research_diagnosis.py" -v
      - name: Fitted forecast campaign and readable case browser gate
        run: python -m unittest discover -s tests -p "test_forecast_campaign.py" -v
      - name: Windows-safe progress publication and held-reader regression gate
        run: python -m unittest discover -s tests -p "test_research_progress.py" -v
      - name: Reasoning research category
        run: python tests/suite_group_runner.py reasoning_research
      - name: Curriculum event category
        run: python tests/suite_group_runner.py curriculum_event
      - name: Governance storage category
        run: python tests/suite_group_runner.py governance_storage
      - name: MT5 certification category
        run: python tests/suite_group_runner.py mt5_certification
      - name: Full unittest suite
        run: python -m unittest discover -s tests -v
