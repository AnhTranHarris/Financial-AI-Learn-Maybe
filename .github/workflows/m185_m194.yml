name: m185-m194-operational-hardening

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  operational-hardening:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      PYTHONWARNINGS: "error::DeprecationWarning"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile operational hardening surfaces
        run: python -m compileall -q src/dusty tests tools

      - name: M185-M189 gates
        run: >-
          python -c "import pathlib,subprocess,sys;
          files=list(pathlib.Path('tests').glob('test_m18*.py'));
          raise SystemExit(subprocess.call([sys.executable,'-m','unittest','discover','-s','tests','-p','test_m18*.py','-v']) if files else 0)"

      - name: M190-M194 gates
        run: >-
          python -c "import pathlib,subprocess,sys;
          files=list(pathlib.Path('tests').glob('test_m19*.py'));
          raise SystemExit(subprocess.call([sys.executable,'-m','unittest','discover','-s','tests','-p','test_m19*.py','-v']) if files else 0)"

      - name: No new direct broker-send surfaces after M187
        shell: bash
        if: runner.os != 'Windows'
        run: >-
          python -c "from pathlib import Path;
          names=['m165_native_history_discovery.py','m165_calibration_roundtrip.py','m165_calibration_execution.py','m165_runtime_execution.py','m165_broker_forensics.py','m165_post_send_resolution.py','m165_native_observations.py','m165_observation_custody.py','m165_calibration_campaign.py','m166_production_admission.py','m174_production_chain.py','m185_production_qualification.py','m185_production_custody.py','m186_production_admission.py','m187_production_admission.py','m187_calibration_bridge.py','execution_reconciliation.py','m188_production_reconciliation.py','demo_execution_cost_learning.py','m189_production_cost_learning.py','restart_recovery.py','m190_production_recovery.py','provider_degradation.py','strategy_drift.py','champion_suspension.py','single_desk_demo_certification.py','m194_native_demo_preflight.py','m194_native_demo_journal.py','m194_native_demo_runtime.py','m194_production_runtime_admission.py','m194_production_certification.py'];
          rows=[Path('src/dusty')/name for name in names if (Path('src/dusty')/name).exists()];
          tool_names=['check_m165_calibration_day_eligibility.py','check_m166_m174_production_readiness.py','execute_m165_calibration_roundtrip_v2_floating_stop.py','execute_m165_calibration_roundtrip_v3.py','extract_m165_native_observations.py','harvest_m165_completed_roundtrip.py','recover_m165_open_calibration_position.py','run_m165_day1_calibration_batch.py','run_m165_day1_calibration_resume_v2.py','run_m165_calibration_day.py','run_m165_calibration_day_guarded.py'];
          rows += [Path('tools')/name for name in tool_names if (Path('tools')/name).exists()];
          bad=[str(path) for path in rows if 'order_send(' in path.read_text(encoding='utf-8')];
          assert not bad, f'direct broker-send surface outside M187 adapter owner: {bad}'"
